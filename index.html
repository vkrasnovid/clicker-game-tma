<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Кликер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== CSS Custom Properties — Dark Theme ===== */
    :root {
      --bg: #0e0e0e;
      --bg-gradient: radial-gradient(ellipse at top, #1a1a2e 0%, #0e0e0e 70%);
      --surface: #1e1e1e;
      --surface2: #2a2a2a;
      --accent: #ffd700;
      --accent-glow: rgba(255, 215, 0, 0.35);
      --text: #f0f0f0;
      --text-muted: #888;
      --coin-color: #cd7f32;
      --coin-glow: rgba(205, 127, 50, 0.5);
      --danger: #e74c3c;
      --success: #2ecc71;
      --border: #333;
      --card-bg: #1e1e1e;
      --btn-disabled: #333;
      --btn-disabled-text: #555;
    }
    body.light {
      --bg: #f0f0f0;
      --bg-gradient: radial-gradient(ellipse at top, #e8e8f0 0%, #f0f0f0 70%);
      --surface: #ffffff;
      --surface2: #e8e8e8;
      --text: #111;
      --text-muted: #666;
      --border: #ddd;
      --card-bg: #fff;
      --btn-disabled: #ccc;
      --btn-disabled-text: #999;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ===== Layout ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ===== Header ===== */
    #header {
      padding: 12px 16px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      text-align: center;
      flex-shrink: 0;
    }
    #score-display {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      line-height: 1.1;
    }
    #per-sec-display {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    #stage-label {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 99px;
      background: var(--coin-color);
      color: #000;
      margin-top: 4px;
      transition: background 0.6s ease;
    }
    #stage-progress-wrap {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    #stage-progress {
      height: 100%;
      background: var(--coin-color);
      border-radius: 2px;
      transition: width 0.3s ease, background 0.6s ease;
      width: 0%;
    }

    /* ===== Coin Area ===== */
    #coin-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    #coin-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #coin {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--coin-color) 60%, white), var(--coin-color) 50%, color-mix(in srgb, var(--coin-color) 80%, black));
      box-shadow:
        0 0 40px var(--coin-glow),
        0 0 80px var(--coin-glow),
        inset 0 -8px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      line-height: 1;
      transition: background 0.6s ease, box-shadow 0.6s ease;
      transform-origin: center;
      will-change: transform;
      min-width: 160px;
      min-height: 160px;
    }
    #coin:active { transform: scale(0.96); }
    #coin-tap-power {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ===== Stats Panel ===== */
    #stats {
      padding: 6px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      font-size: 0.72rem;
      color: var(--text-muted);
      overflow-x: auto;
      flex-shrink: 0;
      white-space: nowrap;
    }
    #stats span { flex-shrink: 0; }
    #stats span b { color: var(--text); }

    /* ===== Shop Panel ===== */
    #shop-panel {
      flex-shrink: 0;
      height: 220px;
      overflow-y: auto;
      padding: 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #shop-panel::-webkit-scrollbar { width: 4px; }
    #shop-panel::-webkit-scrollbar-track { background: transparent; }
    #shop-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .shop-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
      transition: transform 0.1s ease, filter 0.1s ease, border-color 0.2s;
      cursor: pointer;
    }
    .shop-card:not(.disabled):hover { transform: scale(0.99); filter: brightness(1.1); border-color: var(--accent); }
    .shop-card:not(.disabled):active { transform: scale(0.97); }
    .shop-card.disabled { opacity: 0.45; cursor: not-allowed; }
    .shop-card.rush-active { border-color: var(--success); animation: rush-pulse 1s infinite; }
    @keyframes rush-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); } 50% { box-shadow: 0 0 8px 2px rgba(46,204,113,0.4); } }
    .card-icon { font-size: 1.6rem; flex-shrink: 0; width: 36px; text-align: center; }
    .card-body { flex: 1; min-width: 0; }
    .card-name { font-size: 0.82rem; font-weight: 600; }
    .card-desc { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
    .card-level { font-size: 0.65rem; background: var(--surface2); border-radius: 99px; padding: 1px 7px; color: var(--text-muted); }
    .card-cost { font-size: 0.78rem; font-weight: 700; color: var(--accent); }
    .card-cost.cannot-afford { color: var(--text-muted); }

    /* ===== Bottom Actions ===== */
    #bottom-bar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, filter 0.1s;
      min-height: 44px;
      touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.96); }
    #prestige-btn {
      background: linear-gradient(135deg, #9b59b6, #6c3483);
      color: #fff;
      display: none;
    }
    #share-btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ===== Modals ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .modal-body { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .modal-body b { color: var(--text); }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    .modal-btn-primary { background: var(--accent); color: #000; }
    .modal-btn-secondary { background: var(--surface2); color: var(--text); }

    /* ===== Floating Text ===== */
    .float-text {
      position: fixed;
      pointer-events: none;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
      animation: float-up 0.9s ease-out forwards;
      z-index: 500;
      white-space: nowrap;
    }
    .float-text.critical { color: #ff4444; font-size: 1.4rem; }
    .float-text.mega { color: #ff00ff; font-size: 1.7rem; }
    @keyframes float-up {
      0%   { transform: translate(-50%, 0); opacity: 1; }
      100% { transform: translate(-50%, -90px); opacity: 0; }
    }

    /* ===== Particles ===== */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--coin-color);
      pointer-events: none;
      z-index: 499;
      animation: particle-fly 0.7s ease-out forwards;
    }
    @keyframes particle-fly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* ===== Coin Bounce ===== */
    @keyframes tap-bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(0.88); }
      70%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .coin-bounce { animation: tap-bounce 0.25s ease; }

    /* ===== Crystals display ===== */
    #crystals-display {
      display: none;
      font-size: 0.75rem;
      color: #b9f2ff;
      margin-top: 2px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div id="score-display">0</div>
    <div id="per-sec-display">0 монет/сек</div>
    <div id="crystals-display">💎 0 кристаллов</div>
    <span id="stage-label">Бронза</span>
    <div id="stage-progress-wrap">
      <div id="stage-progress"></div>
    </div>
  </div>

  <!-- Coin tap area -->
  <div id="coin-area">
    <div id="coin-wrap">
      <div id="coin">🪙</div>
    </div>
    <div id="coin-tap-power">+1 за тап</div>
  </div>

  <!-- Stats strip -->
  <div id="stats">
    <span>Тапов: <b id="stat-taps">0</b></span>
    <span>Заработано: <b id="stat-total">0</b></span>
    <span>Время: <b id="stat-time">0:00:00</b></span>
  </div>

  <!-- Shop panel -->
  <div id="shop-panel"></div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <button id="prestige-btn" class="action-btn" onclick="openPrestigeModal()">⭐ Престиж</button>
    <button id="share-btn" class="action-btn" onclick="shareScore()">📤 Поделиться</button>
  </div>

</div>

<!-- Offline modal -->
<div id="offline-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">Добро пожаловать!</div>
    <div class="modal-body" id="offline-modal-body">Вы заработали <b>0</b> монет пока отсутствовали.</div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-primary" onclick="closeOfflineModal()">Забрать</button>
    </div>
  </div>
</div>

<!-- Prestige modal -->
<div id="prestige-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">⭐ Престиж</div>
    <div class="modal-body" id="prestige-modal-body">Сбросить прогресс? Вы получите <b>0</b> кристаллов.</div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-secondary" onclick="closePrestigeModal()">Отмена</button>
      <button class="modal-btn modal-btn-primary" onclick="confirmPrestige()">Сбросить</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ===== Telegram WebApp Init =====
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  console.log('[TG] WebApp detected, version=%s', tg.version);
  console.log('[TG] colorScheme=%s', tg.colorScheme);
  if (tg.colorScheme === 'light') {
    document.body.classList.add('light');
  }
} else {
  console.log('[TG] No Telegram WebApp SDK detected, running in browser mode');
}

function hapticTap() {
  console.debug('[TG] haptic tap');
  tg?.HapticFeedback?.impactOccurred('light');
}
function hapticBuy() {
  tg?.HapticFeedback?.impactOccurred('medium');
}

// ===== UPGRADES Config =====
const UPGRADES = [
  { id: 'tapPower',    name: 'Сила тапа',         icon: '👊', desc: '+%v за тап',          baseCost: 10,   baseEffect: 1,  type: 'tap'       },
  { id: 'autoClicker', name: 'Автокликер',          icon: '🤖', desc: '+%v/сек',             baseCost: 50,   baseEffect: 1,  type: 'passive'   },
  { id: 'multiplier',  name: 'Множитель',           icon: '✖️', desc: 'x%v к доходу',       baseCost: 200,  baseEffect: 2,  type: 'multiplier'},
  { id: 'critTap',     name: 'Критический тап',     icon: '⚡', desc: '%v% шанс x10',       baseCost: 150,  baseEffect: 5,  type: 'crit'      },
  { id: 'megaTap',     name: 'Мега тап',            icon: '💥', desc: 'каждый 50-й x100',   baseCost: 500,  baseEffect: 1,  type: 'mega'      },
  { id: 'goldRush',    name: 'Золотая лихорадка',   icon: '🌟', desc: '10 сек всё x5',      baseCost: 1000, baseEffect: 1,  type: 'rush'      },
];

// ===== Stages Config =====
const STAGES = [
  { name: 'Бронза',   threshold: 0,           color: '#cd7f32', glow: 'rgba(205,127,50,0.5)',  emoji: '🥉' },
  { name: 'Серебро',  threshold: 1000,        color: '#c0c0c0', glow: 'rgba(192,192,192,0.5)', emoji: '🥈' },
  { name: 'Золото',   threshold: 100000,      color: '#ffd700', glow: 'rgba(255,215,0,0.5)',   emoji: '🥇' },
  { name: 'Платина',  threshold: 10000000,    color: '#e5e4e2', glow: 'rgba(229,228,226,0.5)', emoji: '💎' },
  { name: 'Алмаз',   threshold: 1000000000,  color: '#b9f2ff', glow: 'rgba(185,242,255,0.5)', emoji: '💠' },
];

// ===== State =====
const DEFAULT_STATE = () => ({
  coins: 0,
  totalCoins: 0,
  totalTaps: 0,
  tapPower: 1,
  perSecond: 0,
  critChance: 0,
  crystals: 0,
  prestigeMultiplier: 1,
  upgrades: {
    tapPower:    { level: 0 },
    autoClicker: { level: 0 },
    multiplier:  { level: 0 },
    critTap:     { level: 0 },
    megaTap:     { level: 0 },
    goldRush:    { level: 0 },
  },
  stage: 'Бронза',
  sessionStart: Date.now(),
  lastSave: Date.now(),
});

let state = DEFAULT_STATE();

// Gold Rush runtime state
let goldRushActive = false;
let goldRushTimer = null;
let goldRushEndTime = 0;

// ===== Persistence =====
function saveState() {
  try {
    state.lastSave = Date.now();
    // [FIX:M-4] persist goldRushEndTime so an active Gold Rush survives reload
    state.goldRushEndTime = goldRushEndTime;
    localStorage.setItem('clicker_save', JSON.stringify(state));
    console.debug('[SAVE] saved at', Date.now());
  } catch(e) {
    console.warn('[SAVE] failed:', e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem('clicker_save');
    if (!raw) {
      console.debug('[LOAD] no saved state, using defaults');
      return;
    }
    const saved = JSON.parse(raw);
    // Deep merge with defaults
    const def = DEFAULT_STATE();
    state = { ...def, ...saved };
    // Ensure upgrades are complete
    state.upgrades = { ...def.upgrades, ...saved.upgrades };
    // sessionStart is always fresh
    state.sessionStart = Date.now();
    // [FIX:M-6] clamp numeric fields so a corrupted save cannot propagate NaN/null through state
    state.coins              = Math.max(0, Number(state.coins)              || 0);
    state.totalCoins         = Math.max(0, Number(state.totalCoins)         || 0);
    state.totalTaps          = Math.max(0, Number(state.totalTaps)          || 0);
    state.tapPower           = Math.max(1, Number(state.tapPower)           || 1);
    state.perSecond          = Math.max(0, Number(state.perSecond)          || 0);
    state.critChance         = Math.max(0, Number(state.critChance)         || 0);
    state.crystals           = Math.max(0, Number(state.crystals)           || 0);
    state.prestigeMultiplier = Math.max(1, Number(state.prestigeMultiplier) || 1);
    state.goldRushEndTime    = Math.max(0, Number(state.goldRushEndTime)    || 0);
    console.debug('[LOAD] loaded state', state);
  } catch(e) {
    console.warn('[LOAD] failed, using defaults:', e);
    state = DEFAULT_STATE();
  }
}

function resetState() {
  const crystals = state.crystals;
  const prestigeMultiplier = state.prestigeMultiplier;
  state = DEFAULT_STATE();
  state.crystals = crystals;
  state.prestigeMultiplier = prestigeMultiplier;
  state.sessionStart = Date.now();
  // [FIX:H-3] reset tapCount so Mega Tap cadence starts fresh after prestige
  tapCount = 0;
  goldRushActive = false;
  goldRushEndTime = 0;
  if (goldRushTimer) { clearTimeout(goldRushTimer); goldRushTimer = null; }
  console.debug('[RESET] state reset, kept crystals=%d multiplier=%f', crystals, prestigeMultiplier);
}

// Auto-save every 10 seconds
setInterval(saveState, 10000);

// Save on visibility change (tab hide / app minimize)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    saveState();
    console.debug('[SAVE] visibility change — saved');
  }
});

// ===== Utilities =====
function formatNumber(n) {
  if (!isFinite(n) || isNaN(n)) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e12) return (n / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
  if (abs >= 1e9)  return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (abs >= 1e6)  return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (abs >= 1e3)  return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return Math.floor(n).toString();
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ===== Upgrade Calculations =====
function getUpgradeCost(id) {
  const upg = UPGRADES.find(u => u.id === id);
  const level = state.upgrades[id]?.level ?? 0;
  return Math.ceil(upg.baseCost * Math.pow(1.15, level));
}

function getUpgradeEffect(id) {
  const upg = UPGRADES.find(u => u.id === id);
  const level = state.upgrades[id]?.level ?? 0;
  if (upg.type === 'multiplier') return 1 + 0.5 * level;
  return upg.baseEffect * level;
}

function recalcStats() {
  const tapLevel     = state.upgrades.tapPower.level;
  const autoLevel    = state.upgrades.autoClicker.level;
  const multLevel    = state.upgrades.multiplier.level;
  const critLevel    = state.upgrades.critTap.level;

  const multiplier   = 1 + 0.5 * multLevel;
  state.tapPower     = Math.max(1, 1 + tapLevel) * multiplier;
  state.perSecond    = autoLevel * multiplier;
  state.critChance   = Math.min(critLevel * 5, 80); // cap at 80%

  console.debug('[UPGRADE] recalcStats tapPower=%d perSec=%f critChance=%d%',
    state.tapPower, state.perSecond, state.critChance);
}

function buyUpgrade(id) {
  const cost = getUpgradeCost(id);
  if (state.coins < cost) return;

  // Gold Rush activates on purchase (not level-based)
  if (id === 'goldRush') {
    state.coins -= cost;
    state.upgrades[id].level++;
    activateGoldRush();
    console.log('[UPGRADE] bought %s level=%d cost=%d', id, state.upgrades[id].level, cost);
    hapticBuy();
    recalcStats();
    renderShop();
    updateUI();
    saveState();
    return;
  }

  state.coins -= cost;
  state.upgrades[id].level++;
  recalcStats();
  console.log('[UPGRADE] bought %s level=%d cost=%d', id, state.upgrades[id].level, cost);
  hapticBuy();
  renderShop();
  updateUI();
  saveState();
}

// [FIX:M-4] accept optional duration so we can restore a partial Gold Rush after reload
function activateGoldRush(duration = 10000) {
  if (goldRushTimer) clearTimeout(goldRushTimer);
  goldRushActive = true;
  goldRushEndTime = Date.now() + duration;
  console.log('[GOLDRUSH] activated, ends at', goldRushEndTime, 'duration=%d', duration);
  renderShop();
  goldRushTimer = setTimeout(() => {
    goldRushActive = false;
    goldRushTimer = null;
    goldRushEndTime = 0;
    console.log('[GOLDRUSH] expired');
    renderShop();
    updateUI();
  }, duration);
}

// ===== Stage System =====
let currentStageIndex = 0;

function updateStage() {
  let idx = 0;
  for (let i = STAGES.length - 1; i >= 0; i--) {
    if (state.totalCoins >= STAGES[i].threshold) { idx = i; break; }
  }
  const stage = STAGES[idx];
  if (state.stage !== stage.name) {
    state.stage = stage.name;
    console.log('[STAGE] changed to %s', stage.name);
  }
  currentStageIndex = idx;

  // Update CSS vars
  document.documentElement.style.setProperty('--coin-color', stage.color);
  document.documentElement.style.setProperty('--coin-glow', stage.glow);

  // Update label
  document.getElementById('stage-label').textContent = stage.emoji + ' ' + stage.name;

  // Progress bar
  const nextStage = STAGES[idx + 1];
  if (nextStage) {
    const curr = stage.threshold;
    const next = nextStage.threshold;
    const pct = Math.min(100, ((state.totalCoins - curr) / (next - curr)) * 100);
    document.getElementById('stage-progress').style.width = pct + '%';
  } else {
    document.getElementById('stage-progress').style.width = '100%';
  }
  document.getElementById('stage-progress').style.background = stage.color;
}

// ===== Prestige =====
function calcPrestigeCrystals() {
  return Math.max(1, Math.floor(Math.log10(state.totalCoins)));
}

function openPrestigeModal() {
  const earned = calcPrestigeCrystals();
  document.getElementById('prestige-modal-body').innerHTML =
    `Сбросить прогресс? Вы получите <b>${earned}</b> кристаллов.<br><small>Множитель: x${(1 + (state.crystals + earned) * 0.1).toFixed(1)}</small>`;
  document.getElementById('prestige-modal').style.display = 'flex';
}

function closePrestigeModal() {
  document.getElementById('prestige-modal').style.display = 'none';
}

function confirmPrestige() {
  const earned = calcPrestigeCrystals();
  state.crystals += earned;
  state.prestigeMultiplier = 1 + state.crystals * 0.1;
  console.log('[PRESTIGE] crystals=%d multiplier=%f', state.crystals, state.prestigeMultiplier);
  closePrestigeModal();
  resetState();
  recalcStats();
  renderShop();
  updateUI();
  saveState();
}

// ===== Tap Mechanic =====
let tapCount = 0;

function handleTap(e) {
  e.preventDefault();

  // Get coordinates
  let x, y;
  if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }

  tapCount++;
  state.totalTaps++;

  let gain = state.tapPower * state.prestigeMultiplier;
  let floatClass = '';

  // Mega tap: every 50th — [FIX:M-2] scale by megaTap upgrade level so higher levels matter
  if (tapCount % 50 === 0) {
    const megaEffect = Math.max(1, getUpgradeEffect('megaTap'));
    gain *= 100 * megaEffect;
    floatClass = 'mega';
    console.debug('[TAP] mega tap! megaEffect=%d', megaEffect);
  }
  // Critical tap (only if not mega)
  else if (state.critChance > 0 && Math.random() * 100 < state.critChance) {
    gain *= 10;
    floatClass = 'critical';
    console.debug('[TAP] critical hit!');
  }

  // Gold Rush multiplier
  if (goldRushActive) {
    gain *= 5;
    console.debug('[TAP] gold rush active, multiplier=5');
  }

  gain = Math.ceil(gain);
  state.coins += gain;
  state.totalCoins += gain;

  console.debug('[TAP] gain=%d totalCoins=%d', gain, state.totalCoins);

  hapticTap();

  // Bounce animation on coin
  const coin = document.getElementById('coin');
  coin.classList.remove('coin-bounce');
  void coin.offsetWidth; // reflow
  coin.classList.add('coin-bounce');
  coin.addEventListener('animationend', () => coin.classList.remove('coin-bounce'), { once: true });

  // Floating text
  spawnFloatText(x, y, '+' + formatNumber(gain), floatClass);

  // Particles
  spawnParticles(x, y, 4);

  updateUI();
}

// ===== Floating Text =====
function spawnFloatText(x, y, text, extraClass) {
  const el = document.createElement('div');
  el.className = 'float-text' + (extraClass ? ' ' + extraClass : '');
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove(), { once: true });
}

// ===== Particles =====
function spawnParticles(x, y, count) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    const angle = (Math.random() * 360) * (Math.PI / 180);
    const dist = 40 + Math.random() * 60;
    el.style.left = (x - 4) + 'px';
    el.style.top  = (y - 4) + 'px';
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue('--coin-color').trim();
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }
}

// ===== Passive Income =====
function startAutoClicker() {
  setInterval(() => {
    if (state.perSecond <= 0) return;
    // [FIX:H-2] floor gain to prevent float accumulation causing display lag
    const gain = Math.floor(state.perSecond * state.prestigeMultiplier * (goldRushActive ? 5 : 1));
    state.coins += gain;
    state.totalCoins += gain;
    console.debug('[AUTO] tick gain=%d perSec=%f', gain, state.perSecond);
    updateUI();
  }, 1000);
}

// ===== Offline Earnings =====
function calcOfflineEarnings() {
  if (!state.lastSave || state.perSecond <= 0) return 0;
  const elapsed = Math.min(Date.now() - state.lastSave, 2 * 3600 * 1000);
  const coins = Math.floor(state.perSecond * (elapsed / 1000) * state.prestigeMultiplier);
  console.log('[OFFLINE] elapsed=%ds earned=%f', (elapsed / 1000).toFixed(0), coins);
  return coins;
}

function closeOfflineModal() {
  document.getElementById('offline-modal').style.display = 'none';
}

// ===== Render Shop =====
function renderShop() {
  const panel = document.getElementById('shop-panel');
  panel.innerHTML = '';

  UPGRADES.forEach(upg => {
    const level  = state.upgrades[upg.id]?.level ?? 0;
    const cost   = getUpgradeCost(upg.id);
    const canBuy = state.coins >= cost;
    const effect = getUpgradeEffect(upg.id);

    // [FIX:M-5] at level 0 multiplier shows "×1.0" (no effect); show post-purchase preview instead
    let descText;
    if (upg.id === 'multiplier' && level === 0) {
      descText = '×1.5 после покупки';
    } else {
      descText = upg.desc.replace('%v', upg.id === 'multiplier'
        ? 'x' + (1 + 0.5 * level).toFixed(1)
        : (upg.id === 'critTap' ? Math.min(level * 5, 80) + '%' : effect));
    }

    const isRushActive = upg.id === 'goldRush' && goldRushActive;
    const rushSuffix = isRushActive
      ? ` <span style="color:var(--success)">⚡ Активна</span>`
      : '';

    const card = document.createElement('div');
    card.className = 'shop-card' + (canBuy ? '' : ' disabled') + (isRushActive ? ' rush-active' : '');
    card.innerHTML = `
      <div class="card-icon">${upg.icon}</div>
      <div class="card-body">
        <div class="card-name">${upg.name}${rushSuffix}</div>
        <div class="card-desc">${descText}</div>
      </div>
      <div class="card-right">
        <span class="card-level">Ур. ${level}</span>
        <span class="card-cost ${canBuy ? '' : 'cannot-afford'}">🪙 ${formatNumber(cost)}</span>
      </div>`;

    if (canBuy) {
      card.addEventListener('click', () => buyUpgrade(upg.id));
      card.addEventListener('touchend', (e) => { e.preventDefault(); buyUpgrade(upg.id); });
    }
    panel.appendChild(card);
  });
}

// ===== UI Update =====
function updateUI() {
  console.debug('[UI] updateUI called, coins=%f', state.coins);

  document.getElementById('score-display').textContent = formatNumber(state.coins);
  document.getElementById('per-sec-display').textContent = formatNumber(state.perSecond * state.prestigeMultiplier) + ' монет/сек';

  // Tap power hint
  const tapHint = '+' + formatNumber(state.tapPower * state.prestigeMultiplier) + ' за тап';
  document.getElementById('coin-tap-power').textContent = tapHint;

  // Crystals
  const crystalsEl = document.getElementById('crystals-display');
  if (state.crystals > 0) {
    crystalsEl.style.display = 'block';
    crystalsEl.textContent = '💎 ' + state.crystals + ' кристаллов (x' + state.prestigeMultiplier.toFixed(1) + ')';
  } else {
    crystalsEl.style.display = 'none';
  }

  // Prestige button
  const prestigeVisible = state.totalCoins >= 1_000_000;
  document.getElementById('prestige-btn').style.display = prestigeVisible ? 'block' : 'none';

  // Stage update
  updateStage();

  // Shop affordability (lightweight)
  document.querySelectorAll('.shop-card').forEach((card, i) => {
    const upg = UPGRADES[i];
    if (!upg) return;
    const cost = getUpgradeCost(upg.id);
    const canBuy = state.coins >= cost;
    if (canBuy && card.classList.contains('disabled')) {
      card.classList.remove('disabled');
      card.addEventListener('click', () => buyUpgrade(upg.id));
      // [FIX:H-1] add touchend so newly-affordable cards respond immediately on mobile
      card.addEventListener('touchend', (e) => { e.preventDefault(); buyUpgrade(upg.id); });
    } else if (!canBuy && !card.classList.contains('disabled')) {
      renderShop();
    }
    card.querySelector('.card-cost').className = 'card-cost' + (canBuy ? '' : ' cannot-afford');
  });

  // Stats
  document.getElementById('stat-taps').textContent = formatNumber(state.totalTaps);
  document.getElementById('stat-total').textContent = formatNumber(state.totalCoins);
  document.getElementById('stat-time').textContent = formatTime(Date.now() - state.sessionStart);
}

// Stats time update every second
setInterval(() => {
  document.getElementById('stat-time').textContent = formatTime(Date.now() - state.sessionStart);
}, 1000);

// ===== Share =====
function shareScore() {
  const msg = `Я набрал ${formatNumber(state.totalCoins)} монет в Кликере! 🎮`;
  // [FIX:M-3] switchInlineQuery requires inline-bot registration; use openTelegramLink instead
  if (tg?.openTelegramLink) {
    tg.openTelegramLink('https://t.me/share/url?url=https%3A%2F%2Ft.me%2F&text=' + encodeURIComponent(msg));
  } else if (tg?.sendData) {
    tg.sendData(msg);
  } else {
    // Browser fallback
    if (navigator.share) {
      navigator.share({ text: msg }).catch(() => {});
    } else {
      navigator.clipboard?.writeText(msg).then(() => {
        alert('Скопировано: ' + msg);
      }).catch(() => alert(msg));
    }
  }
}

// ===== Touch events on coin =====
// [FIX:M-1] guard click against synthetic post-touchstart fire on older Android webviews
let _lastTouchTime = 0;
const coinEl = document.getElementById('coin');
coinEl.addEventListener('touchstart', (e) => { _lastTouchTime = Date.now(); handleTap(e); }, { passive: false });
coinEl.addEventListener('click', (e) => { if (Date.now() - _lastTouchTime > 350) handleTap(e); });

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
  console.log('[INIT] DOM loaded');

  loadState();
  recalcStats();

  // [FIX:M-4] restore Gold Rush if it was still active when the page was last saved
  if (state.goldRushEndTime && state.goldRushEndTime > Date.now()) {
    const remaining = state.goldRushEndTime - Date.now();
    console.log('[GOLDRUSH] restoring with %dms remaining', remaining);
    activateGoldRush(remaining);
  }

  // Offline earnings
  const offlineCoins = calcOfflineEarnings();
  if (offlineCoins > 0) {
    state.coins += offlineCoins;
    state.totalCoins += offlineCoins;
    document.getElementById('offline-modal-body').innerHTML =
      `Вы заработали <b>${formatNumber(offlineCoins)}</b> монет пока отсутствовали.`;
    document.getElementById('offline-modal').style.display = 'flex';
  }

  renderShop();
  updateUI();
  startAutoClicker();
});
</script>
